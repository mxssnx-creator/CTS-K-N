name: Dev Preview Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-preview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Light, memory-fitting smoke: 1 symbol validates boot -> migrations ->
      # explicit QuickStart symbol preservation -> endpoint health without the
      # unbounded key growth that exhausts an in-process Redis on small runners.
      DEV_SOAK_SYMBOL_COUNT: "1"
      DEV_NODE_HEAP_MB: "4096"
      FORCE_SIMULATED: "1"
      FORCE_LIVE: "0"
      ALLOW_PROD_SIMULATED: "1"
      BINGX_API_KEY: ""
      BINGX_API_SECRET: ""
      BYBIT_API_KEY: ""
      BYBIT_API_SECRET: ""
      PIONEX_API_KEY: ""
      PIONEX_API_SECRET: ""
      ORANGEX_API_KEY: ""
      ORANGEX_API_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release completeness
        run: |
          node scripts/verify-recreation-manifests.mjs
          bash scripts/install.sh \
            --name cts-ci \
            --port 49317 \
            --runtime pm2 \
            --service-user "$(id -un)" \
            --state-dir /tmp/cts-ci-state \
            --preflight-only \
            --skip-system-packages \
            --non-interactive
      # The unit and integration suites gate every merge. Without this step CI
      # only checked release completeness and the dev-preview verifier, so a
      # commit that changed behaviour without updating its guardrail tests
      # reported success and landed on main red — which the installer then
      # refuses to deploy, turning a test failure into a failed production
      # deploy. Redis is required by a small number of integration suites.
      - name: Start Redis for integration suites
        run: |
          (redis-server --port 6399 --save "" --appendonly no --daemonize yes) || \
            (sudo apt-get update -qq && sudo apt-get install -y -qq redis-server && \
             redis-server --port 6399 --save "" --appendonly no --daemonize yes)
          redis-cli -p 6399 ping
      - name: Run unit and integration tests
        run: |
          node --max-old-space-size=4096 \
            node_modules/jest/bin/jest.js \
            --runInBand \
            --testPathPatterns="__tests__/(unit|integration)" \
            --ci --silent
      - name: Run dev-preview smoke verifier
        run: node scripts/run-dev-preview-check.mjs
